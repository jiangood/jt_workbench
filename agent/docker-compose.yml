# 部署双容器：agent + watchtower fork（v4.4：原版已归档，fork 语法兼容）
# watchtower 用 ghcr：hub 上的正确仓库名是 nickfedor/watchtower（nicholas-fedor 那个在 hub 不存在），
# 且国内直连 hub 基本拉不动；ghcr 与 hub 同流水线发布，内容一致
# v4.12：本文件由后台「添加节点」生成的一键脚本自动落盘（含内联的 NODE_KEY）。
#        这里留作手工部署参考：<NODE_KEY> 从后台该节点「安装命令」弹窗的手动方案里复制
#        （列表不展示密钥；需要换密钥点「重置密钥」后用新命令重新部署）
services:
  workbench-agent:
    image: ghcr.io/jiangood/workbench-agent:latest
    restart: unless-stopped
    environment:
      - NODE_KEY=<后台添加节点后生成>
      - SERVER_URL=https://jt.410518072.xyz
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true # 只更新带标签容器，不碰宿主机其他容器
      - WATCHTOWER_POLL_INTERVAL=900 # 15 分钟轮询
      - WATCHTOWER_CLEANUP=true
