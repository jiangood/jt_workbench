# 部署双容器：agent + watchtower fork（v4.4：原版已归档，fork 语法兼容）
# v4.12：本文件由后台「添加节点」生成的一键脚本自动落盘（含内联的 NODE_KEY）。
#        这里留作手工部署参考：把 <NODE_KEY> 换成后台该节点显示/复制的密钥即可。
services:
  workbench-agent:
    image: ghcr.io/jiangood/workbench-agent:latest
    restart: unless-stopped
    command: ['https://jt.410518072.xyz'] # 唯一的启动配置：Worker 地址
    environment:
      - NODE_KEY=<后台添加节点后生成>
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: nicholas-fedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true # 只更新带标签容器，不碰宿主机其他容器
      - WATCHTOWER_POLL_INTERVAL=900 # 15 分钟短轮询
      - WATCHTOWER_CLEANUP=true
