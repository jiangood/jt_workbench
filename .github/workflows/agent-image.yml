name: agent-image
on:
  push:
    branches: [main]
    paths: ['agent/**', '.github/workflows/agent-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      # CI 门禁：类型检查不过不推镜像（deploy.yml 同款）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/workbench-agent
          # 双标签：latest（Watchtower 轮询目标）+ v<sha>（不可变回滚锚点）
          tags: |
            type=raw,value=latest
            type=sha,prefix=v,format=short
      - uses: docker/build-push-action@v6
        with:
          context: agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
