name: release

# push vX.Y.Z tag 自动发布；也可通过 workflow_dispatch 指定 tag 手动触发。
# 构建并推送 GHCR 镜像，目标机 docker compose pull && up 手动部署。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在且位于 main 上的发布 tag
        required: true
        type: string

permissions:
  contents: write # 创建 GitHub Release
  packages: write # 推送 GHCR 镜像

# 发布串行执行，避免并发发布冲突
concurrency:
  group: production
  cancel-in-progress: false

# buildx 默认会把构建记录(.dockerbuild)作为 artifact 上传,纯发布用不到
env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Fetch refs
        shell: bash
        run: |
          git fetch --tags --force origin
          git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Resolve release ref
        id: ref
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Invalid release tag: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/jt_workbench"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # release 的 tag 必须打在 main 的提交上：防止把实验分支发上线
      - name: Ensure ref is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::发布提交不在 main 上（release 的 tag 必须打在 main 的提交上）"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (GHCR)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          # 目标机均为 x86_64，只构建 amd64（不做多架构）
          platforms: linux/amd64
          tags: |
            ${{ steps.ref.outputs.image }}:latest
            ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}
          cache-from: type=gha,scope=jt-workbench
          cache-to: type=gha,mode=max,scope=jt-workbench
          # ACR 个人版不接受 BuildKit 默认的 provenance 清单（OCI empty v1 json），必须显式关闭
          provenance: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

      - name: Summary
        shell: bash
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          SHA: ${{ steps.ref.outputs.sha }}
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          {
            echo "## Release ${TAG:-$SHA}"
            echo "- commit: \`$SHA\`"
            echo "- image: \`${IMAGE}:latest\` (GHCR)"
            echo "- image: \`${IMAGE}:${TAG}\` (GHCR)"
            echo "- deploy: manual \`docker compose pull && docker compose up -d\` on target host"
          } >> "$GITHUB_STEP_SUMMARY"
