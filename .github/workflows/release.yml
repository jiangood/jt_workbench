name: release

# 唯一的线上发布入口：在 GitHub 上「发布 release」时部署。
# 不响应分支/tag push，也不提供手动触发；失败用 Actions 的 Re-run jobs 重跑。
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write # 推 ghcr 镜像

# 发布串行执行，避免两个 release 同时改线上
concurrency:
  group: production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    # 仓库 Settings → Environments 给 production 配 required reviewer 后，
    # 发布 release 不会立刻上线，而是先等人工批准（不配则直接执行）。
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Fetch refs
        shell: bash
        run: |
          git fetch --tags --force origin
          git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Resolve release ref
        id: ref
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      # release 的 tag 必须打在 main 的提交上：防止把实验分支发上线
      - name: Ensure ref is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::发布提交不在 main 上（release 的 tag 必须打在 main 的提交上）"
            exit 1
          fi

      # 只发布有变化的半边：纯 worker 发布不重推 agent :latest（否则所有节点会白白重启）
      - name: Detect changed areas
        id: diff
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          BASE=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" HEAD)
          else
            CHANGED=$(git ls-files)
          fi
          echo "diff base: ${BASE:-<none>}" >> "$GITHUB_STEP_SUMMARY"
          if printf '%s\n' "$CHANGED" | grep -q '^worker/'; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$CHANGED" | grep -q '^agent/'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            agent/package-lock.json

      - name: Worker — install
        if: steps.diff.outputs.worker == 'true'
        working-directory: worker
        run: npm ci

      - name: Worker — typecheck
        if: steps.diff.outputs.worker == 'true'
        working-directory: worker
        run: npm run check

      - name: Worker — dry-run bundle
        if: steps.diff.outputs.worker == 'true'
        working-directory: worker
        run: npm run deploy:dry

      - name: Agent — install
        if: steps.diff.outputs.agent == 'true'
        working-directory: agent
        run: npm ci

      - name: Agent — typecheck
        if: steps.diff.outputs.agent == 'true'
        working-directory: agent
        run: npm run check

      # 迁移必须向后兼容（expand/contract）：D1 不能随 Worker 回滚
      - name: D1 — apply migrations
        if: steps.diff.outputs.worker == 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply jt_workbench --remote

      - name: Worker — deploy
        if: steps.diff.outputs.worker == 'true'
        working-directory: worker
        run: npm run deploy

      - uses: docker/setup-buildx-action@v3
        if: steps.diff.outputs.agent == 'true'

      - uses: docker/login-action@v3
        if: steps.diff.outputs.agent == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.diff.outputs.agent == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/workbench-agent
          # latest（Watchtower 轮询目标）+ 发布 tag（可追溯）+ v<sha>（不可变回滚锚点）
          tags: |
            type=raw,value=latest
            type=sha,prefix=v,format=short
            type=raw,value=${{ github.event.release.tag_name }}

      - uses: docker/build-push-action@v6
        if: steps.diff.outputs.agent == 'true'
        with:
          context: agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        shell: bash
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          SHA: ${{ steps.ref.outputs.sha }}
          WORKER_CHANGED: ${{ steps.diff.outputs.worker }}
          AGENT_CHANGED: ${{ steps.diff.outputs.agent }}
        run: |
          {
            echo "## Release ${TAG:-$SHA}"
            echo "- commit: \`$SHA\`"
            echo "- worker: $WORKER_CHANGED"
            echo "- agent: $AGENT_CHANGED"
          } >> "$GITHUB_STEP_SUMMARY"
