name: release

# 手动 push vX.Y.Z tag 自动部署；PR 合并后的 auto-tag workflow 显式调用 workflow_dispatch。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在且位于 main 上的发布 tag
        required: true
        type: string

permissions:
  contents: write # 创建 GitHub Release
  packages: write # 推 ghcr 镜像

# 发布串行执行，避免两个 release 同时改线上
concurrency:
  group: production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    # 故意不声明 environment：未配任何 protection rule 时它只会凭空生成
    # Deployments 记录（仓库右侧面板），与 Cloudflare 实际部署无关，纯噪音。
    # 将来若需要「发布后悔窗口」，再加 environment + wait timer（solo 仓库用
    # required reviewers 会因「不能自批」而失效）。
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Fetch refs
        shell: bash
        run: |
          git fetch --tags --force origin
          git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Resolve release ref
        id: ref
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then

      # release 的 tag 必须打在 main 的提交上：防止把实验分支发上线
      - name: Ensure ref is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::发布提交不在 main 上（release 的 tag 必须打在 main 的提交上）"
            exit 1
          fi

      # 只发布有变化的半边：纯 worker 发布不重推 agent :latest（否则所有节点会白白重启）
      - name: Detect changed areas
        id: diff
        shell: bash
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          BASE=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" HEAD)
          else
            CHANGED=$(git ls-files)
          fi
          echo "diff base: ${BASE:-<none>}" >> "$GITHUB_STEP_SUMMARY"
          if printf '%s\n' "$CHANGED" | grep -q '^worker/'; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$CHANGED" | grep -q '^agent/'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            agent/package-lock.json

      - name: Worker — install
        # agent 发布也会用到这里的 wrangler（发布后回写 agent_latest_version）
        if: steps.diff.outputs.worker == 'true' || steps.diff.outputs.agent == 'true'
        working-directory: worker
        run: npm ci

      - name: Worker — typecheck
        if: steps.diff.outputs.worker == 'true'
        working-directory: worker
        run: npm run check

      - name: Worker — dry-run bundle
        if: steps.diff.outputs.worker == 'true'
        working-directory: worker
        run: npm run deploy:dry

      - name: Agent — install
        if: steps.diff.outputs.agent == 'true'
        working-directory: agent
        run: npm ci

      - name: Agent — typecheck
        if: steps.diff.outputs.agent == 'true'
        working-directory: agent
        run: npm run check

      # 迁移必须向后兼容（expand/contract）：D1 不能随 Worker 回滚
      - name: D1 — apply migrations
        if: steps.diff.outputs.worker == 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply jt_workbench --remote

      - name: Worker — deploy
        if: steps.diff.outputs.worker == 'true'
        working-directory: worker
        run: npm run deploy

      # Worker 部署成功后回写系统版本（发布 tag），便于后台确认线上实际版本
      - name: Worker — publish app version
        if: steps.diff.outputs.worker == 'true'
        working-directory: worker
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
            echo "::error::发布 tag 含非法字符：$RELEASE_TAG"
            exit 1
          fi
          npx wrangler d1 execute jt_workbench --remote --yes --command \
            "INSERT INTO app_config (k, v, updated_at) VALUES ('app_version', '${RELEASE_TAG}', $(date +%s)000) ON CONFLICT (k) DO UPDATE SET v = excluded.v, updated_at = excluded.updated_at"

      - uses: docker/setup-buildx-action@v3
        if: steps.diff.outputs.agent == 'true'

      - uses: docker/login-action@v3
        if: steps.diff.outputs.agent == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.diff.outputs.agent == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/workbench-agent
          # latest（Watchtower 轮询目标）+ 发布 tag（可追溯）+ v<sha>（不可变回滚锚点）
          tags: |
            type=raw,value=latest
            type=sha,prefix=v,format=short
            type=raw,value=${{ steps.ref.outputs.tag }}

      - uses: docker/build-push-action@v6
        if: steps.diff.outputs.agent == 'true'
        with:
          context: agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 版本号烧进镜像（Dockerfile → esbuild define）：节点据此判断自己是否需要升级
          build-args: |
            AGENT_VERSION=${{ steps.ref.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像推成功后再公布「最新版本」：节点下次 poll 拿到它，空闲时触发 Watchtower 即时升级
      - name: Agent — publish latest version
        if: steps.diff.outputs.agent == 'true'
        working-directory: worker
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z._-]+$'; then
            echo "::error::发布 tag 含非法字符：$RELEASE_TAG"
            exit 1
          fi
          npx wrangler d1 execute jt_workbench --remote --yes --command \
            "INSERT INTO app_config (k, v, updated_at) VALUES ('agent_latest_version', '${VERSION}', $(date +%s)000) ON CONFLICT (k) DO UPDATE SET v = excluded.v, updated_at = excluded.updated_at"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

      - name: Summary
        shell: bash
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          SHA: ${{ steps.ref.outputs.sha }}
          WORKER_CHANGED: ${{ steps.diff.outputs.worker }}
          AGENT_CHANGED: ${{ steps.diff.outputs.agent }}
        run: |
          {
            echo "## Release ${TAG:-$SHA}"
            echo "- commit: \`$SHA\`"
            echo "- worker: $WORKER_CHANGED"
            echo "- agent: $AGENT_CHANGED"
          } >> "$GITHUB_STEP_SUMMARY"
; then
            echo "::error::非法发布 tag：$TAG（要求 vX.Y.Z）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

