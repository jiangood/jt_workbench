name: ci

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          IMAGE="registry.cn-hangzhou.aliyuncs.com/jiangood/jt_workbench"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to Aliyun Container Registry
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: hustme
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          {
            echo "## Latest image"
            echo "- commit: \`$SHA\`"
            echo "- image: \`${IMAGE}:latest\` (Aliyun ACR)"
            echo "- image: \`${IMAGE}:sha-${SHA}\` (Aliyun ACR)"
          } >> "$GITHUB_STEP_SUMMARY"
