name: ci

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'agent/**'
      - 'worker/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install Agent dependencies
        working-directory: agent
        run: npm ci
      - name: Agent typecheck
        working-directory: agent
        run: npm run check
      - name: Agent tests
        working-directory: agent
        run: npm test
      - name: Agent bundle
        working-directory: agent
        run: npm run build
      - name: Verify remote scripts resolve image dependencies and helper bundles
        working-directory: agent
        run: |
          mkdir -p .agent-scripts/zsxq_sync .agent-scripts/rss_fetch
          cp ../worker/agent-scripts/zsxq_sync/1.0.0.mjs .agent-scripts/zsxq_sync/1.0.0.mjs
          cp ../worker/agent-scripts/rss_fetch/1.0.0.mjs .agent-scripts/rss_fetch/1.0.0.mjs
          node --input-type=module -e "const zsxq = await import('./.agent-scripts/zsxq_sync/1.0.0.mjs'); const rss = await import('./.agent-scripts/rss_fetch/1.0.0.mjs'); if (typeof zsxq.run !== 'function' || typeof rss.run !== 'function') throw new Error('remote script entrypoint missing')"
          rm -rf .agent-scripts

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Build Agent script manifest
        working-directory: worker
        run: npm run scripts:build
      - name: Apply all D1 migrations locally
        working-directory: worker
        run: npx wrangler d1 migrations apply jt_workbench --local --persist-to /tmp/jt-workbench-d1
      - name: Worker typecheck
        working-directory: worker
        run: npm run check
