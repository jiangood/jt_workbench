<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/logo.png" type="image/png" sizes="80x80" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>个人工作台</title>
    <script>
      // 首屏定主题：localStorage 优先，其次跟随系统；必须在样式表之前执行，避免闪白
      ;(() => {
        try {
          const saved = localStorage.getItem('wb-theme')
          const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link href="/app.css" rel="stylesheet" />
  </head>
  <body>
    <a class="skip" href="#main">跳到主内容</a>
    <header class="topbar">
      <button class="icon-btn" id="nav-toggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="打开导航">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <span class="brand-inline"><img class="brand-mark" src="/logo.png" alt="" width="28" height="28" />个人工作台</span>
    </header>

    <div class="app">
      <nav class="sidebar" id="sidebar" aria-label="主导航">
        <div class="brand"><img class="brand-mark" src="/logo.png" alt="" width="32" height="32" />个人工作台</div>
      </nav>
      <div class="mainwrap" id="mainwrap">
        <div id="banner-slot"></div>
        <div class="container" id="view-host"><main id="main" tabindex="-1"></main></div>
      </div>
    </div>

    <div class="scrim" id="nav-scrim" aria-hidden="true"></div>

    <!-- 常驻播放器：切视图不断播；队列 / 模式 / 播放列表由 lib.js 的 initPlayer 渲染 -->
    <div class="playerbar" id="player-bar" hidden>
      <div class="container player-inner">
        <div class="np">
          <svg class="ico np-note" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12" /><circle cx="6" cy="18" r="3" /><circle cx="16" cy="18" r="2.5" /></svg>
          <span class="np-meta">
            <span class="np-title truncate" id="np-title"></span>
            <span class="np-sub truncate" id="np-sub"></span>
          </span>
        </div>
        <div class="player-ctrls" role="group" aria-label="播放控制">
          <button class="icon-btn" id="np-prev" type="button" aria-label="上一首" title="上一首"></button>
          <button class="icon-btn" id="np-next" type="button" aria-label="下一首" title="下一首"></button>
          <button class="icon-btn" id="np-mode" type="button" aria-label="播放模式" title="播放模式"></button>
          <button class="icon-btn np-queue" id="np-queue" type="button" aria-label="播放列表" aria-controls="playlist" aria-expanded="false" title="播放列表"></button>
        </div>
        <audio id="player" controls preload="metadata"></audio>
      </div>
    </div>

    <!-- 播放列表面板：从播放条右上方弹出，随播放器常驻（内容由 initPlayer 渲染） -->
    <section class="playlist" id="playlist" hidden aria-label="播放列表">
      <div class="playlist-head">
        <strong>播放列表</strong>
        <span class="small muted" id="pl-count"></span>
        <span class="playlist-acts">
          <span id="pl-more"></span>
          <button class="icon-btn" id="pl-close" type="button" aria-label="关闭播放列表" title="关闭播放列表">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18" /></svg>
          </button>
        </span>
      </div>
      <ol class="playlist-items" id="pl-items"></ol>
    </section>

    <!-- 上传队列：挂 shell，切页继续传；内容由 upload.js 渲染 -->
    <section class="uploads" id="uploads" hidden aria-label="上传队列">
      <div class="uploads-head">
        <button class="icon-btn up-toggle" id="up-toggle" type="button" aria-expanded="false" aria-controls="up-list" aria-label="展开上传列表">
          <svg class="ico up-caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </button>
        <span class="uploads-title" id="up-title">准备上传</span>
        <span class="uploads-acts">
          <button class="btn sm" id="up-cancel" type="button" hidden>取消全部</button>
          <button class="icon-btn up-x" id="up-close" type="button" aria-label="关闭上传面板" title="关闭上传面板">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18" /></svg>
          </button>
        </span>
      </div>
      <ul class="uploads-list" id="up-list"></ul>
      <p class="sr-only" id="up-live" role="status" aria-live="polite"></p>
    </section>

    <dialog id="dlg"><div id="dlg-body"></div></dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
