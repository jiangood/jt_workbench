<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench</title>
    <script>
      // 首屏定主题：localStorage 优先，其次跟随系统；必须在样式表之前执行，避免闪白
      ;(() => {
        try {
          const saved = localStorage.getItem('wb-theme')
          const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link href="/app.css" rel="stylesheet" />
  </head>
  <body>
    <a class="skip" href="#main">跳到主内容</a>
    <header class="topbar">
      <button class="icon-btn" id="nav-toggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="打开导航">
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <span class="brand-inline">Workbench</span>
    </header>

    <div class="app">
      <nav class="sidebar" id="sidebar" aria-label="主导航">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Workbench</div>
      </nav>
      <div class="mainwrap" id="mainwrap">
        <div id="banner-slot"></div>
        <div class="container" id="view-host"><main id="main" tabindex="-1"></main></div>
      </div>
    </div>

    <div class="scrim" id="nav-scrim" aria-hidden="true"></div>

    <!-- 常驻播放器：切视图不断播 -->
    <div class="playerbar" id="player-bar" hidden>
      <div class="container flex center">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12" /><circle cx="6" cy="18" r="3" /><circle cx="16" cy="18" r="2.5" /></svg>
        <span class="small truncate" id="np-title"></span>
        <audio id="player" controls style="flex: 1 1 auto; height: 34px"></audio>
      </div>
    </div>

    <dialog id="dlg"><div id="dlg-body"></div></dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
